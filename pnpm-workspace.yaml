  - tsdown@0.23.4

trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  cli:
    '@antfu/eslint-config': ^10.0.0
    '@types/node': ^26.6.6
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.44.0
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.4
    tsx: ^4.23.15
    typescript: ^6.0.3
  testing:
    vitest: ^5.0.5
