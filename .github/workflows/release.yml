name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      # Trusted publishing (OIDC) needs a trusted publisher configured on npmjs.com.
      # The first version is published by hand, so skip if the tag is already on npm.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "agent-knip@$version" version > /dev/null 2>&1; then
            echo "agent-knip@$version is already published, skipping"
            exit 0
          fi
          pnpm publish --no-git-checks
